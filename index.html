<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - AntonioJrSales</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!--Person-->
    <section id="person">
        <div class="person-content">
            <div class="person-name">
                <h1>Olá, <span></span></h1>
                <h1>Meu nome é <span></span></h1>
                <h1>Antonio Gomes <span></span></h1>
            </div>
        
            <div class="stacks-content">
                <h3>Techs :</h3>
                <div class="stacks">
                    <nav>
                        <ul class="tech-list">
                            <li>
                                <div data="PYTHON">
                                    <img src="img/python-logo-only.svg" alt="python-icon">
                                </div>
                            </li>
                            <li>
                                <div data="HTML">
                                    <img src="img/html.svg" alt="html-icon">
                                </div>
                            </li>
                            <li>
                                <div data="CSS">
                                    <img src="img/css.svg" alt="css-icon">
                                </div>
                            </li>
                            
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
            <div class="person-background">
                <div class="wrapper-profiler-photo">
                    <img class="profiler-photo" src="img/transferir.webp" alt="foto-icon">
                </div>
                <div class="links">
                    <img src="img/logo-github.svg" alt="github-icon">
                    <img src="img/logo-insta.svg" alt="insta-icon">
                    <img src="img/logo-linkedin.svg" alt="linkedin-icon">
                </div>
            </div>
        
    </section>
    <!--End Person-->

</html>
